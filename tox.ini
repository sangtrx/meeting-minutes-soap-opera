[tox]
envlist = py38,py39,py310,py311,py312,lint,type

[testenv]
deps = -r{toxinidir}/requirements-dev.txt
commands = pytest tests/ -v

[testenv:lint]
commands = ruff check meeting_minutes_soap_opera tests

[testenv:type]
commands = mypy meeting_minutes_soap_opera

[testenv:format]
commands = black meeting_minutes_soap_opera tests
